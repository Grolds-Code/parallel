name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install uv
        run: python -m pip install uv==0.12.22
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Current application validation (mandatory)
        run: uv run --no-sync pytest -q --ignore=tests/test_heldout.py
      - name: Original historical validation (mandatory)
        run: uv run --no-sync python tools/validate_heldout_v1.py
      - name: Syntax and whitespace checks
        run: |
          uv run --no-sync python -m compileall -q src tests tools deployment
          node --check src/parallel_agent/web_assets/app.js
          node --check tests/web_demo_ui.cjs
          git diff --check
